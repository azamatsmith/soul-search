services:
  - type: web
    name: soul-search-api
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    branch: main
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: CORS_ORIGINS
        sync: false
