name: Deploy drift

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      API_URL: https://soul-search-api.onrender.com
      GRACE_SECONDS: 1200
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Compare the deployed api commit with main
        run: |
          expected=$(git rev-parse HEAD)
          committed_at=$(git log -1 --format=%ct HEAD)
          age=$(( $(date +%s) - committed_at ))
          if body=$(curl --fail --silent --show-error --retry 3 --retry-all-errors "$API_URL/version"); then
            deployed=$(jq -r .commit <<< "$body")
          else
            deployed="unreachable"
          fi
          echo "main: $expected (${age}s old)"
          echo "api:  $deployed"
          if [ "$deployed" = "$expected" ]; then
            echo "The api is running main."
          elif [ "$age" -lt "$GRACE_SECONDS" ]; then
            echo "main is newer than the grace period, giving Render time to deploy."
          else
            echo "::error::The api is running $deployed but main has been at $expected for ${age}s. Render has not deployed it."
            exit 1
          fi
