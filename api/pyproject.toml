[project]
name = "soul-search-api"
version = "0.1.0"
description = "Soul Search API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.162.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
