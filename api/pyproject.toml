[project]
name = "soul-search-api"
version = "0.1.0"
description = "Soul Search API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pyjwt[crypto]>=2.15.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the local Supabase database"]
addopts = "-m 'not db'"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
